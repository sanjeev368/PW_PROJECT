<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Text:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <div class="container">
    <div class="titleSection">
      <h1>Welcome to Tic Tac MyTicTacToe</h1>
      <div class="game-turn-details-container">
        <span class="turn-details">Turn for x</span>
        <button class="reset">Reset</button>
      </div>
      <div class="actualGameConatiner">
        <div class="game-row">
          <div class="box box-left box-top"></div>
          <div class="box box-top"></div>
          <div class="box box-right box-top"></div>
        </div>
        <div class="game-row">
          <div class="box box-left"></div>
          <div class="box"></div>
          <div class="box box-right"></div>
        </div>
        <div class="game-row">
          <div class="box box-left box-bottom"></div>
          <div class="box box-bottom"></div>
          <div class="box box-right box-bottom"></div>
        </div>
      </div>
    </div>
  </div>
  <div class="modal">
    <div class="modalContent">
      <h2 class="winMessageContent">Player x wins!🎉</h2>
      <button class="play-again">Play Again</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>

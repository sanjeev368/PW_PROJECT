<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="Container">
    <input type="checkbox" id="toggle" class="toggle-checkbox hidden"/>
      <div class="form-container sign-up">
        <form>
          <h1>Create Account</h1>
          <div class="social-icons">
            <div class="icons">
              <i class="fa-brands fa-google"></i>
            </div>
            <div class="icons">
              <i class="fa-brands fa-facebook-f"></i>
            </div>
            <div class="icons">
              <i class="fa-brands fa-github"></i>
            </div>
            <div class="icons">
              <i class="fa-brands fa-linkedin-in"></i>
            </div>
          </div>
          <span>or use your email for registeration</span>
          <input placeholder="name" type="name"/>
          <input placeholder="email" type="email"/>
          <input placeholder="password" type="password"/>
          <button>Sign Up</button>
        </form>
      </div>
      <div class="form-container sign-in">
          <form>
          <h1>Sign In</h1>
          <div class="social-icons">
            <div class="icons">
              <i class="fa-brands fa-google"></i>
            </div>
            <div class="icons">
              <i class="fa-brands fa-facebook-f"></i>
            </div>
            <div class="icons">
              <i class="fa-brands fa-github"></i>
            </div>
            <div class="icons">
              <i class="fa-brands fa-linkedin-in"></i>
            </div>
          </div>
          <span>or use  your eamil password </span>
          <input placeholder="email" type="email"/>
          <input placeholder="password" type="password"/>
          <a href="#">Forget Your Password</a>
          <button>Sign In</button>
        </form>
      </div>
      <div class="toggle-container">
        <div class="toggle">
            <div class="toggle-panel toggle-left">
              <h1>Welcome Back!</h1>
              <p>
                Enter Your personal details to use all of site features
              </p>
              <label for="toggle">Sign In</label>
            </div>
            <div class="toggle-panel toggle-right">
                <h1>Hello Friends!</h1>
              <p>
              Register width your personal details to use all of site features
              </p>
              <label for="toggle">Sign Up</label>
            </div>
        </div>
      </div>
    </div>
</body>
</html>
